<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notgroschen — Haushaltsplanung</title>
<meta name="description" content="Lokal-first Haushalts- und Finanzplanung für Mehrpersonenhaushalte.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18V9M8.5 18V5M14 18v-6M19.5 18V8"/><path d="M2 21h20"/>
      </svg>
    </span>
    <span class="brand-text">
      <strong>Notgroschen</strong>
      <small id="brandSubtitle">Haushaltsplanung</small>
    </span>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche">
    <button class="tab" role="tab" data-view="dashboard" aria-selected="true">Übersicht</button>
    <button class="tab" role="tab" data-view="people" aria-selected="false">Personen</button>
    <button class="tab" role="tab" data-view="items" aria-selected="false">Posten</button>
    <button class="tab" role="tab" data-view="transactions" aria-selected="false">Buchungen</button>
    <button class="tab" role="tab" data-view="investments" aria-selected="false">Investments</button>
    <button class="tab" role="tab" data-view="debts" aria-selected="false">Kredite</button>
    <button class="tab" role="tab" data-view="plans" aria-selected="false">Planung</button>
    <button class="tab" role="tab" data-view="fire" aria-selected="false">FIRE</button>
    <button class="tab" role="tab" data-view="data" aria-selected="false">Daten</button>
  </nav>

  <div class="header-actions">
    <span class="save-state" id="saveState" title="Automatisch im Browser gespeichert">gespeichert</span>
    <button class="btn btn-ghost btn-icon" id="themeToggle" title="Design wechseln" aria-label="Design wechseln">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
    <button class="btn btn-ghost" id="btnImportTop">Laden</button>
    <button class="btn btn-primary" id="btnExportTop">Speichern</button>
  </div>
</header>

<main id="view" class="view" role="main"></main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="modalRoot" class="modal-root" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle">Titel</h2>
      <button class="btn btn-ghost btn-icon" data-close="1" aria-label="Schließen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" hidden>

<!-- Klassische Scripts (kein type="module"), damit die App auch per file:// ohne
     lokalen Server läuft. Reihenfolge = Abhängigkeitsreihenfolge. -->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/sankey.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/people.js"></script>
<script src="js/views/items.js"></script>
<script src="js/views/transactions.js"></script>
<script src="js/views/investments.js"></script>
<script src="js/views/debts.js"></script>
<script src="js/views/plans.js"></script>
<script src="js/views/fire.js"></script>
<script src="js/views/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
